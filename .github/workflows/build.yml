name: Build IR Console

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - os: windows-latest
            name: Windows
            extra: ""
          - os: ubuntu-latest
            name: Linux
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DIRC_BUILD_TESTS=ON ${{ matrix.extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/IRConsoleTests_artefacts/Release/IRConsoleTests

      - uses: actions/upload-artifact@v4
        with:
          name: IRConsole-${{ matrix.name }}
          path: |
            build/IRConsole_artefacts/Release/VST3
            build/IRConsole_artefacts/Release/AU
            build/IRConsole_artefacts/Release/Standalone
